[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comsigi-backend"
version = "0.1.0"
description = "Comsigi FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
